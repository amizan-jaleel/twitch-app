# Dependabot can't read build.sbt. Submitting the resolved sbt graph lets
# GitHub raise Dependabot alerts for Scala/Java dependencies.
name: Update Dependency Graph

on:
  push:
    branches: [master]
    paths:
      - '**.sbt'
      - 'project/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: sbt/setup-sbt@v1

      - uses: scalacenter/sbt-dependency-submission@v3
