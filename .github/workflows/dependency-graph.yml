# Dependabot can't read build.sbt. Submitting the resolved sbt graph lets
# GitHub raise Dependabot alerts for Scala/Java dependencies.
name: Update Dependency Graph

on:
  push:
    branches: [master]
    paths:
      - '**.sbt'
      - 'project/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Adoptium's SemVer for JDK 21.0.13.1+2 (Java4Shell fix).
          java-version: '21.0.13+100000002.0.LTS'
          distribution: 'temurin'
          check-latest: true

      - uses: sbt/setup-sbt@v1

      - uses: scalacenter/sbt-dependency-submission@v3
