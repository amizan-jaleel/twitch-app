name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.scala'
      - '**.sbt'
      - 'project/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'build-mobile.sh'
      - 'ios/**'
      - '**/*.swift'
      - '**/*.xcodeproj/**'
      - '**/*.xcconfig'
      - '**/Package.swift'
      - '**/Package.resolved'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
      - 'e2e/**'
  pull_request:
    branches: [master]
    paths:
      - '**.scala'
      - '**.sbt'
      - 'project/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'build-mobile.sh'
      - 'ios/**'
      - '**/*.swift'
      - '**/*.xcodeproj/**'
      - '**/*.xcconfig'
      - '**/Package.swift'
      - '**/Package.resolved'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
      - 'e2e/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/sbt.gpg
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build project
        run: sbt compile

      - name: Build production JS
        run: sbt frontend/fullLinkJS

      - name: Run tests
        run: sbt test

  ios-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build Capacitor app
        run: ./build-mobile.sh

      - name: Verify Xcode project and shared schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Select iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          simulator_udid="$(python3 - <<'PY'
          import json
          import subprocess

          devices_by_runtime = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          )["devices"]

          fallback = None
          for runtime, devices in devices_by_runtime.items():
              if ".iOS-" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  fallback = fallback or device
                  device_type = device.get("deviceTypeIdentifier", "")
                  if ".iPhone-" in device_type or device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)

          if fallback:
              print(fallback["udid"])
              raise SystemExit(0)

          raise SystemExit(1)
          PY
          )"
          if [ -z "$simulator_udid" ]; then
            echo "No available iOS simulator found" >&2
            exit 1
          fi
          echo "destination=platform=iOS Simulator,id=${simulator_udid}" >> "$GITHUB_OUTPUT"

      - name: Build iOS app (Debug)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            build

      - name: Build iOS app (Release)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "${{ steps.simulator.outputs.destination }}" \
            build

  docker-build-and-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: twitch-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start app container
        run: |
          docker run -d --name app -p 8080:8080 \
            -e TWITCH_CLIENT_ID=fake \
            -e TWITCH_CLIENT_SECRET=fake \
            twitch-app:test
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y --prefix e2e
          npm install --prefix e2e @playwright/test
          npx --prefix e2e playwright install --with-deps chromium

      - name: Run smoke test
        run: npx --prefix e2e playwright test --config e2e/playwright.config.ts

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 || true
