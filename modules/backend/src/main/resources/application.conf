twitch-app {
  poller {
    interval = 60s
    recently-live-window = 5m
    parallel-categories = 5
    streams-page-size = 100
  }
  search {
    page-size = 20
  }
  oauth {
    state-ttl = 10m
  }
  session {
    ttl = 30d
  }
  limits {
    max-followed-categories = 500
    max-tag-filters = 100
    max-ignored-streamers = 500
    max-push-subscriptions = 20
  }
  sse {
    reconnect-delay = 5s
    max-connections = 1000
    max-connections-per-user = 5
    queue-capacity = 100
  }
  email {
    from = "aabil11@twitchnotify.com"
    from-name = "Twitch Category Tracker"
  }
  push {
    action-token-ttl = 30m
    parallel-sends = 10
  }
  top-games {
    count = 200
    poll-interval = 3h
  }
  auth {
    token-refresh-skew = 5m
  }
}
